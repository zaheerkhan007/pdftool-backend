# Standalone build + smoke test for the backend image — nothing from the server.
# Own Postgres, own Redis, own network. Proves the fresh image has the new tool
# routes + LibreOffice before you ship it into the shared prod stack.
#
#   docker compose -f docker-compose.standalone.yml up --build
#   # then verify (new route should be 405 Method-Not-Allowed, NOT 404):
#   curl -s -o /dev/null -w "%{http_code}\n" http://localhost:8000/api/tools/pdf-to-jpg/
#   curl -s http://localhost:8000/api/tools/health/
#
#   docker compose -f docker-compose.standalone.yml down -v   # clean up

name: pdftool-standalone

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pdftool
      POSTGRES_USER: pdftool
      POSTGRES_PASSWORD: pdftool
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdftool"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine

  backend:
    build: .                       # <-- builds THIS backend image, standalone
    environment:
      SECRET_KEY: standalone-not-a-real-secret
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      USE_POSTGRES: "True"
      POSTGRES_HOST: db
      POSTGRES_DB: pdftool
      POSTGRES_USER: pdftool
      POSTGRES_PASSWORD: pdftool
      CELERY_BROKER_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      MAX_UPLOAD_MB: "50"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
